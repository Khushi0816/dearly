[project]
name = "dearly"
version = "0.1.0"
description = "Dearly - A private digital diary and memory archive"
readme = "README.md"
authors = [
    { name = "Khushi Singh", email = "khushi.singh1661@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[project.scripts]
backend = "backend.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
